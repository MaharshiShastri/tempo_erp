services:

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    environment:
      RUN_MIGRATIONS: "false"
  web:
    build: .
    image: tempo-erp-app:v1.5.0
    command: uvicorn server:app --host 0.0.0.0 --port 8500
    volumes:
      - .:/app
    ports:
      - "8500:8500"
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      RUN_MIGRATIONS: "true"

  worker:
    build: .
    image: tempo-erp-app:v1.5.0
    command: celery -A services.celery_app:celery worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      RUN_MIGRATIONS: "false"
  beat:
    build: .
    image: tempo-erp-app:v1.5.0
    command: celery -A services.celery_app:celery beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      RUN_MIGRATIONS: "false"
  
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    environment:
      RUN_MIGRATIONS: "false"